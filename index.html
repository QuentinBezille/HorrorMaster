<body class="page-boosters">

<header>
  <h1>Horror <span>Master</span></h1>
  <p class="intro">Une carte par film d'horreur. Plus son article Wikipédia est lu, plus la carte est rare.</p>
</header>

<nav class="onglets" role="tablist">
  <button class="onglet-btn" type="button" role="tab" data-onglet="boosters" aria-selected="true">Boosters</button>
  <button class="onglet-btn" type="button" role="tab" data-onglet="cartes" aria-selected="false">Toutes les cartes</button>
  <button class="onglet-btn" type="button" role="tab" data-onglet="collection" aria-selected="false">Collection</button>
</nav>

<section id="onglet-boosters" class="onglet joueur-zone">
  <div id="joueur" class="joueur"></div>
  <p id="statut" class="msg" role="status"></p>

  <div id="booster" class="booster-zone" hidden>
    <p class="booster-compteur" id="booster-compteur"></p>
    <div class="pile" id="pile"></div>
    <div class="rangee" id="rangee" hidden></div>
    <div class="actions">
      <button class="bouton principal" id="suivante" type="button">Retourner la carte</button>
      <button class="bouton principal" id="fin-booster" type="button" hidden>Terminer</button>
    </div>
  </div>
</section>

<section id="onglet-cartes" class="onglet" hidden>

<div class="barre">
  <div class="barre-in">
    <input type="search" id="recherche" name="recherche-films" placeholder="Chercher un film" aria-label="Chercher un film" autocomplete="off">
    <div class="filtres" id="filtres" role="group" aria-label="Filtrer par rareté"></div>
    <select id="tri" aria-label="Trier les cartes">
      <option value="rarete">Trier par rareté</option>
      <option value="vues">Trier par vues</option>
      <option value="atq">Trier par attaque</option>
      <option value="def">Trier par défense</option>
      <option value="annee">Trier par année</option>
      <option value="titre">Trier par titre</option>
    </select>
    <span class="compte" id="compte" aria-live="polite"></span>
  </div>
</div>

<main>
  <div class="grille-zone" id="grille-zone">
    <div class="grille" id="grille"></div>
  </div>
  <div id="message"></div>
  <div class="pagination">
    <button class="bouton" id="prec" type="button">‹ Précédent</button>
    <span id="page-info" aria-live="polite"></span>
    <button class="bouton" id="suiv" type="button">Suivant ›</button>
  </div>
</main>

</section>

<dialog id="detail"></dialog>

<dialog id="connexion">
  <form class="modal-in" method="dialog" onsubmit="return false">
    <h2>Connexion</h2>
    <label>Email <input type="email" id="email" name="email" autocomplete="username"></label>
    <label>Mot de passe <input type="password" id="mdp" name="mdp" autocomplete="current-password" minlength="6"></label>
    <p id="msg-connexion" class="msg" role="status"></p>
    <div class="actions">
      <button class="bouton principal" id="btn-connexion" type="button">Se connecter</button>
      <button class="bouton" id="btn-inscription" type="button">Créer un compte</button>
      <button class="bouton" id="btn-annuler" type="button">Annuler</button>
    </div>
  </form>
</dialog>



<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/cartes.js"></script>
<script src="js/joueur.js"></script>
<script src="js/main.js"></script>
</body>
